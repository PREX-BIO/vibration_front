name: Build iOS IPA (unsigned)
run-name: 'iOS IPA · ${{ github.ref_name }} · #${{ github.run_number }}'

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard macOS runner; Xcode 27.2 matches the local native build.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          pod --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Generate iOS project
        run: |
          npx expo prebuild --platform ios --no-install
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods dependencies
        run: |
          mkdir -p .test-build/ios-unsigned
          pod install --project-directory=ios 2>&1 | tee .test-build/ios-unsigned/pods.log

      - name: Build and package unsigned IPA
        run: npm run build:ios:unsigned

      - name: Upload IPA
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Vibration-iOS-unsigned-${{ github.run_number }}
          path: |
            .test-build/ios-unsigned/Vibration-unsigned.ipa
            .test-build/ios-unsigned/Vibration-unsigned.ipa.sha256
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Vibration-iOS-logs-${{ github.run_number }}
          path: |
            .test-build/ios-unsigned/*.log
            ios/Podfile.lock
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Show installation instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## iPhone에 설치하기
          1. 이 실행의 **Artifacts → Vibration-iOS-unsigned-…**를 내려받고 ZIP을 풉니다.
          2. Windows 또는 Mac의 [Sideloadly](https://sideloadly.io/)에 **Vibration-unsigned.ipa**를 넣습니다.
          3. 본인의 무료 Apple 계정으로 서명하고 USB로 연결한 iPhone에 설치합니다.
          4. iPhone에서 개발자 모드와 개발자 앱 신뢰를 설정하고 Vibration을 실행합니다.

          Release 앱에 JavaScript와 Core Haptics 모듈이 포함되어 있어 Metro가 필요 없습니다.
          새 코드를 테스트하려면 새 IPA를 같은 Apple 계정·번들 ID로 덮어 설치합니다.
          무료 계정의 서명은 설치/갱신 시점부터 7일간 유효합니다. 코드 변경 없이 서명만 갱신할 때는
          기존 IPA를 Sideloadly에서 다시 서명·설치하면 되며, GitHub 빌드는 필요 없습니다.
          자동 갱신은 Sideloadly Daemon이 실행 중인 PC와 USB 또는 설정된 Wi-Fi 연결이 필요합니다.
          Artifacts의 7일 보관 기간은 기기에 설치한 앱의 서명 유효 기간과 별개입니다.
          이 IPA는 서명 전 파일이므로 iPhone에서 링크를 누르는 것만으로 설치되지는 않습니다.
          SUMMARY
